  function evalOL(ol, entries) {

    const lineTxt = marks ? line + " marks" : "grade " + (ol.minGrade || "C");
    const score = e => marks ? (Number(e.m) || 0) : (GRADE_MIN[e.g] || 0);
    const good = e => marks ? score(e) >= line : (e.g !== "W" && score(e) >= line);
    const count = entries.filter(good).length, reasons = [];
    if (count < (Number(ol.minCount) || 0)) reasons.push("Only " + count + " subject(s) reached " + lineTxt + " (needs " + ol.minCount + ")");
    Object.keys(ol.must || {}).forEach(k => {
      if (!ol.must[k]) return;
      const e = entries.find(x => x.k === k);
      if (!e || !good(e)) reasons.push((e ? e.l : k) + " must reach " + lineTxt);

    /* ----- media ----- */

    canCompressVideo: canVideo,
    async saveMedia(blob, meta, onProgress) {
      meta = meta || {};
      const prog = typeof onProgress === "function" ? onProgress : () => {};
      const id = api.uid("M"), type = blob.type || meta.mime || "application/octet-stream";
      const m = { id, k: meta.k || (/^video/.test(type) ? "video" : "image"), mime: type, size: blob.size, w: meta.w || 0, h: meta.h || 0, dur: meta.dur || 0, n: 0 };
      /* 1) Cloudinary: direct upload with real progress (videos) */
      if (meta.cld && /^video\//.test(type)) {
        try {
          const r = await api.cloudUpload(blob, meta.cld, prog);
          m.url = r.url; m.cld = r.id; if (r.dur) m.dur = r.dur; if (r.w) { m.w = r.w; m.h = r.h; }
          return m;
        } catch (e) {
          console.error("Cloudinary upload failed", e);
          if (blob.size > 8 * 1048576 || mode !== "firebase") throw new Error("Cloudinary upload failed: " + (e.message || e));
          console.warn("Small file - falling back to Firestore");
        }
      }
      if (mode === "firebase") {
        const c = window.FIREBASE_CONFIG || {};
        if (c.storageBucket && window.firebase && firebase.storage) {
          try {
            const ref = firebase.storage().ref().child("vx_media/" + id);
            await ref.put(blob, { contentType: type });
            m.url = await ref.getDownloadURL();
            return m;
          } catch (e) { console.warn("Storage upload failed — using Firestore chunks", e); }
        }
        const b64 = await blobToB64(blob);
        m.n = Math.ceil(b64.length / MCH);
        let next = 0, done = 0, failed = false;
        const putChunk = async i => {
          for (let t = 0; ; t++) {
            try {
              await Promise.race([db.collection("vx_media").doc(id + "_" + i).set({ mid: id, i, d: b64.slice(i * MCH, (i + 1) * MCH) }), new Promise((_, rej) => setTimeout(() => rej({ code: "unavailable", message: "no response from Firestore" }), 30000))]);
              return;
            } catch (e) { if (t >= 2 || failed) throw e; await new Promise(r => setTimeout(r, 800 * (t + 1))); }
          }
        };
        const worker = async () => { while (!failed && next < m.n) { const i = next++; await putChunk(i); done++; prog(done / m.n); } };
        try { await Promise.all(Array.from({ length: Math.min(3, m.n) }, worker)); }
        catch (e) { failed = true; await api.deleteMedia(m); console.error("media upload", e); throw new Error("Upload failed: " + (e.code || e.message) + (e.code === "permission-denied" ? " — publish firestore.rules" : e.code === "not-found" || e.code === "unavailable" ? " — create Firestore Database / check internet" : "")); }
        return m;
      }
      const b64 = await blobToB64(blob);
      try { localStorage.setItem("vx_media_" + id, "data:" + type + ";base64," + b64); }
      catch (e) { throw new Error("Browser storage is full — connect Firebase to keep more photos / videos"); }
      prog(1);
      return m;
    },
    cloudCfg(so) {
      so = so || {}; const c = window.CLOUDINARY_CONFIG || {};
      const name = String(so.cldName || c.cloudName || "").trim(), preset = String(so.cldPreset || c.uploadPreset || "").trim();
      return name && preset ? { name, preset } : null;
    },
    cloudUpload(blob, cld, onProgress) {
      return new Promise((resolve, reject) => {
        const fd = new FormData(), ext = ((blob.type || "video/mp4").split("/")[1] || "mp4").split(";")[0].replace("quicktime", "mov");
        fd.append("file", blob, "video." + ext);
        fd.append("upload_preset", cld.preset);
        const x = new XMLHttpRequest();
        x.open("POST", "https://api.cloudinary.com/v1_1/" + encodeURIComponent(cld.name) + "/video/upload");
        x.timeout = 20 * 60 * 1000;
        x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
        x.onload = () => {
          let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {}
          if (x.status >= 200 && x.status < 300 && j.secure_url) {
            let url = j.secure_url;
            if (!/^video\/(mp4|webm)/.test(blob.type)) url = url.replace("/upload/", "/upload/f_mp4,vc_h264,q_auto/").replace(/\.[a-z0-9]+$/i, ".mp4");
            resolve({ url, id: j.public_id, dur: j.duration, w: j.width, h: j.height });
          } else reject(new Error((j.error && j.error.message) || ("HTTP " + x.status)));
        };
        x.onerror = () => reject(new Error("network error — check internet"));
        x.ontimeout = () => reject(new Error("upload timed out"));
        x.send(fd);
      });
    },
    mediaURL(m) {
      if (!m) return Promise.resolve("");
      if (m.url) return Promise.resolve(m.url);
      if (mCache.has(m.id)) return mCache.get(m.id);
      const p = (async () => {
        if (mode !== "firebase") { const d = localStorage.getItem("vx_media_" + m.id); if (!d) throw new Error("missing"); return d; }
        const docs = await Promise.all(Array.from({ length: m.n || 0 }, (_, i) => db.collection("vx_media").doc(m.id + "_" + i).get()));
        if (!docs.length || docs.some(d => !d.exists)) throw new Error("missing");
        return URL.createObjectURL(b64ToBlob(docs.map(d => d.data().d).join(""), m.mime));
      })();
      mCache.set(m.id, p); p.catch(() => mCache.delete(m.id));
      return p;
    },
    async deleteMedia(m) {
      if (!m || m.embed) return;
      mCache.delete(m.id);
      try {

  .kv{display:flex;justify-content:space-between;gap:16px;padding:12px 18px;font-size:.93rem;}

  .empty{text-align:center;color:var(--sub);padding:34px 14px;}

  .presets{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:14px 16px;}
  @media (max-width:440px){.presets{grid-template-columns:repeat(2,1fr);}}
  .presets button{
    border:2px solid transparent;background:var(--card2);color:var(--tx);
    border-radius:16px;padding:10px 6px;font-size:.74rem;font-weight:600;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .presets button.on{border-color:var(--ac);background:rgba(10,132,255,.14);}
  .presets i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.9rem;border:1px solid var(--line);}

  .pv{border-radius:22px;padding:16px;margin-bottom:14px;border:1px solid var(--glass-border);background:var(--bg);color:var(--text);font-family:var(--fb);box-shadow:0 10px 28px rgba(0,0,0,.25);}
  .pv .hd{font-family:var(--fh);font-weight:900;letter-spacing:1px;font-size:1.05rem;}
  .pv .hd span{color:var(--amber);}
  .pv .cd{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);padding:13px;margin:10px 0;}
  .pv .cd b{font-family:var(--fh);font-size:.88rem;}
  .pv .cd small{display:block;color:var(--muted);font-size:.78rem;margin-top:3px;}
  .pv .bt{background:var(--amber);color:#1a1100;border-radius:calc(var(--radius) * .75);padding:11px;text-align:center;font-family:var(--fh);font-weight:800;font-size:.78rem;letter-spacing:1px;}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px;}
  .kpis div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 8px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.1);}
  .kpis b{display:block;font-size:1.35rem;font-weight:800;color:var(--ac);}
  .kpis small{color:var(--sub);font-size:.72rem;font-weight:600;}

  #toast{
    position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));
    transform:translate(-50%,-150%);background:rgba(28,28,30,.94);color:#fff;
    backdrop-filter:blur(20px);border:1px solid var(--line);
    padding:11px 22px;border-radius:99px;opacity:0;transition:.28s var(--spring);
    z-index:300;font-size:.86rem;font-weight:600;pointer-events:none;white-space:nowrap;
    box-shadow:0 12px 32px rgba(0,0,0,.4);
  }
  #toast.on{opacity:1;transform:translate(-50%,0);}
  #toast.bad{background:var(--red);}

  .lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;}
  .lock .li{width:82px;height:82px;border-radius:24px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:grid;place-items:center;font-size:2.4rem;color:#fff;box-shadow:0 12px 30px rgba(10,132,255,.35);}
  .lock .li svg{width:42px;height:42px;}
  .lock .li.img{background:none;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.4);}
  .lock .li img{width:100%;height:100%;object-fit:cover;display:block;}
  .lock h1{font-size:1.65rem;font-weight:800;}
  .lock p{color:var(--sub);font-size:.9rem;}
  .lock input{width:220px;text-align:center;font-size:1.6rem;letter-spacing:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--tx);outline:0;}
  .lock .er{color:var(--red);font-size:.85rem;min-height:18px;}

  /* Modal Dialog (replaces confirm & prompt) */
  .modal-backdrop{
    position:fixed;inset:0;z-index:260;background:rgba(0,0,0,.55);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:grid;place-items:center;padding:20px;
    opacity:0;pointer-events:none;transition:opacity .22s;
  }
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .ios-dialog{
    width:100%;max-width:340px;border-radius:22px;
    background:var(--card);border:1px solid var(--line);
    backdrop-filter:blur(30px);text-align:center;overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    transform:scale(.92);transition:transform .24s var(--spring);
  }
  .modal-backdrop.open .ios-dialog{transform:scale(1);}
  .ios-dialog-body{padding:20px 18px 16px;}
  .ios-dialog-body h4{font-size:1.05rem;font-weight:700;margin-bottom:6px;}
  .ios-dialog-body p{font-size:.83rem;color:var(--sub);margin-bottom:10px;}
  .ios-dialog-body input,.ios-dialog-body textarea,.ios-dialog-body select{
    width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;color:var(--tx);font-size:.9rem;margin-top:8px;outline:0;
  }
  .ios-dialog-acts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);}
  .ios-dialog-acts button{
    padding:13px;border:0;background:transparent;color:var(--ac);
    font:600 .92rem inherit;cursor:pointer;
  }
  .ios-dialog-acts button+button{border-left:1px solid var(--line);}
  .ios-dialog-acts button.danger{color:var(--red);font-weight:700;}

    <div class="ios-dialog-body" id="mdBody"></div>
    <div class="ios-dialog-acts">
      <button type="button" id="mdCancel">Cancel</button>
      <button type="button" id="mdOk">Confirm</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const root = $("#root");
const EMO_RE = /[\u{1F000}-\u{1FAFF}\u2600-\u2604\u2607-\u2712\u2716-\u27BF\u2B50\u2B55\u2B1B\u2B1C\u231A\u231B\u23E9-\u23FF\u200D\uFE0F\u20E3]/gu;
const escE = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const esc = s => String(s ?? "").replace(EMO_RE, "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getP = (o,p) => p.split(".").reduce((a,k) => a == null ? a : a[k], o);
const setP = (o,p,v) => { const ks = p.split("."); let a = o; for(let i=0;i<ks.length-1;i++) a = a[ks[i]]; a[ks[ks.length-1]] = v; };

let selMode = false; const sel = new Set();
let S = null, B = [], R = [], G = [], CHAT = [], stack = [{p:"main"}], saveT, bkFilter = "all", rvFilter = "pending", bInit = false, gInit = false, rgFilter = "all", rgEvent = "all";

/* ---------- Modal Confirm & Form Helpers ---------- */
let _mdCb = null;
function iosConfirm(title, msg, danger, onOk) {
  $("#mdBody").innerHTML = `<h4>${esc(title)}</h4><p>${esc(msg)}</p>`;
  const okBtn = $("#mdOk");
  okBtn.textContent = danger ? "Delete" : "Confirm";
  okBtn.className = danger ? "danger" : "";
  _mdCb = onOk;
  $("#iosModal").classList.add("open");
}
function iosAddReviewModal(onSub) {
  $("#mdBody").innerHTML = `
    <h4>Add Approved Review</h4>
    <p>Enter customer review details</p>
    <input id="mdRvName" placeholder="Customer Name" maxlength="40">
    <select id="mdRvRate">
      <option value="5">(5/5)</option>
      <option value="4">(4/5)</option>
      <option value="3">(3/5)</option>
      <option value="2">(2/5)</option>
      <option value="1">(1/5)</option>
    </select>
    <textarea id="mdRvText" rows="3" placeholder="Review text…" maxlength="240"></textarea>`;
  const okBtn = $("#mdOk");
  okBtn.textContent = "Add Review";
  okBtn.className = "";
  _mdCb = () => {
    const n = ($("#mdRvName")?.value || "").trim();
    const r = Number($("#mdRvRate")?.value || 5);
    const t = ($("#mdRvText")?.value || "").trim();
    if (!n || !t) { toast("Please fill name & review", true); return false; }
    onSub(n, r, t);
  };
  $("#iosModal").classList.add("open");
}
$("#mdCancel").onclick = () => { $("#iosModal").classList.remove("open"); _mdCb = null; };
$("#mdOk").onclick = async () => {
  const cb = _mdCb, ok = $("#mdOk");
  if (cb) {
    let r; ok.disabled = true;
    try { r = cb(); if (r && r.then) r = await r; } catch (e) { toast("Failed: " + (e.code || e.message), true); }
    ok.disabled = false;
    if (r === false) return;
  }
  $("#iosModal").classList.remove("open"); _mdCb = null;
};
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#iosModal").classList.contains("open")) $("#mdCancel").click(); });
window.addEventListener("unhandledrejection", e => toast("Failed: " + ((e.reason && (e.reason.code || e.reason.message)) || "error"), true));

/* ---------- UI theme (admin's own) ---------- */
function applyUI(){ document.body.classList.toggle("light", VX.LS.get("vx_admin_ui","light") === "light"); }
applyUI();
function toast(m, bad){ const t = $("#toast"); t.textContent = m; t.className = "on" + (bad ? " bad" : ""); clearTimeout(t._t); t._t = setTimeout(() => t.className = "", 1900); }

/* ---------- autosave ---------- */
function save(now){
  clearTimeout(saveT);
  const run = async () => { try{ await VX.saveSettings(S); toast("Saved"); }catch(e){ toast("Save failed: " + (e.code || e.message), true); } };
  if(now) return run();
  saveT = setTimeout(run, 450);
}

/* ---------- field builders ---------- */

const fld = {

  emoji:(p,l) => {
    if (!p.startsWith("services.")) return "";
    const id = "emo-in-" + p.replace(/\./g, "-");
    return `<div class="field"><label>${l} <small style="color:var(--ac)">Tap an emoji below or type</small></label><input id="${id}" data-path="${p}" value="${escE(getP(S,p))}" maxlength="8"></div><div class="emo-bar">${EMOJI_PALETTE.map(x => `<button type="button" class="emo-btn" data-emo-target="${p}" data-emo="${x}">${x}</button>`).join("")}</div>`;

  area:(p,l,o={}) => `<div class="field"><label>${l}</label><textarea data-path="${p}" rows="${o.rows||3}">${esc(getP(S,p))}</textarea></div>`,
  num:(p,l) => `<div class="field"><label>${l}</label><input type="number" inputmode="numeric" data-kind="num" data-path="${p}" value="${esc(getP(S,p))}"></div>`,
  lines:(p,l,o={}) => `<div class="field"><label>${l}</label><textarea data-kind="lines" data-path="${p}" rows="${o.rows||5}">${esc((getP(S,p)||[]).join("\n"))}</textarea></div>`,
  sw:(p,l,sub,rr) => `<div class="row"><div class="txt"><b>${l}</b>${sub?`<small>${sub}</small>`:""}</div><label class="sw"><input type="checkbox" data-path="${p}"${rr?" data-rerender=1":""}${getP(S,p)?" checked":""}><i></i></label></div>`,
  color:(p,l) => `<div class="row"><div class="txt"><b>${l}</b><small>${esc(getP(S,p))}</small></div><input type="color" class="clr" data-path="${p}" value="${esc(getP(S,p))}"></div>`,

  sel:(p,l,opts) => `<div class="field"><label>${l}</label><select data-path="${p}">${opts.map(o => `<option${o === getP(S,p) ? " selected":""}>${esc(o)}</option>`).join("")}</select></div>`
};

/* ---------- navigation ---------- */
function go(p, params={}){ selMode = false; sel.clear(); stack.push({p, ...params}); history.pushState({}, ""); render(); window.scrollTo(0,0); }
function back(){ if(stack.length > 1) history.back(); }
window.addEventListener("popstate", () => { selMode = false; sel.clear(); if(stack.length > 1){ stack.pop(); render(); } });
const curPage = () => stack[stack.length-1];
const bar = (right="") => `<div class="bar"><button class="circ" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><div class="acts">${right}</div></div>`;

/* ----- bookings ----- */
const ST = {pending:["clock","#ff9f0a","Pending"], confirmed:["check","#0a84ff","Confirmed"], done:["check2","#30d158","Completed"], cancelled:["x","#ff453a","Cancelled"]};
PAGES.bookings = () => {
  const cnt = s => s === "all" ? B.length : B.filter(b => b.status === s).length;
  const list = B.filter(b => bkFilter === "all" || b.status === bkFilter);
  const td = new Date(), tds = td.getFullYear()+"-"+String(td.getMonth()+1).padStart(2,"0")+"-"+String(td.getDate()).padStart(2,"0");

/* ----- website chat inbox ----- */
const SEND_SVG = '<svg viewBox="0 0 24 24"><path d="M3.4 20.4 21 12 3.4 3.6l.1 6.5L15 12 3.5 13.9z"/></svg>';
function adminChatLogHTML(id){
  const msgs = CHAT.filter(m => m.chatId === id).sort((a,b) => (a.at||0) - (b.at||0));
  if(!msgs.length) return `<div class="empty">No messages yet</div>`;
  let last = "";
  return msgs.map(m => {
    const d = new Date(m.at || Date.now()), day = d.toDateString(), mine = m.sender === "admin";
    const sep = day !== last ? `<div class="chat-day">${day === new Date().toDateString() ? "Today" : esc(d.toLocaleDateString([], {day:"numeric", month:"short"}))}</div>` : "";
    last = day;
    return sep + `<div class="bubble ${mine ? "me" : "them"}"><b>${mine ? "You" : esc(m.name || "Visitor")}</b><span class="bt">${esc(m.text)}</span><time>${esc(d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}))}</time></div>`;
  }).join("");
}
function liveChat(){
  const el = document.getElementById("adminChatLog"); if(!el) return;
  const near = el.scrollHeight - el.scrollTop - el.clientHeight < 90;
  el.innerHTML = adminChatLogHTML(el.dataset.id);
  if(near) el.scrollTop = el.scrollHeight;
}
PAGES.chat = ({id}) => {
  const groups = Object.values(CHAT.reduce((a,m)=>{ const k=m.chatId||"unknown"; (a[k] ||= []).push(m); return a; },{})).map(a=>a.sort((x,y)=>(x.at||0)-(y.at||0)));
  if(id){
    const msgs = CHAT.filter(m=>m.chatId===id);
    const last = msgs.slice().sort((a,b)=>(a.at||0)-(b.at||0)).filter(m=>m.sender!=="admin").pop() || msgs[msgs.length-1] || {};
    const ph = last.phone || "";
    return `${bar()}<h1 class="big sub">${esc(last.name || "Visitor Chat")}</h1><p class="hint">${esc(ph)} · Visitor conversation</p>
      ${ph ? `<div class="group"><div class="pad"><a class="pill sm" href="tel:${esc(ph)}">Call</a><a class="pill sm" style="background:#25d366" href="https://wa.me/${waNum(ph)}" target="_blank" rel="noopener">WhatsApp</a></div></div>` : ""}
      <div class="group"><div class="chat-log" id="adminChatLog" data-id="${esc(id)}">${adminChatLogHTML(id)}</div></div>
      <div class="group"><form id="adminChatForm" class="chat-reply"><input type="hidden" name="chatId" value="${esc(id)}"><textarea name="text" required maxlength="1200" rows="1" placeholder="Write a reply…"></textarea><button class="chat-btn" type="submit" aria-label="Send reply">${SEND_SVG}</button></form></div>`;
  }
  return `${bar()}<h1 class="big sub">Website Chat</h1><p class="hint">Messages from visitors on the public website.</p>
    ${groups.length ? `<div class="group">${groups.sort((a,b)=>(b[b.length-1].at||0)-(a[a.length-1].at||0)).map(a=>{const m=a[a.length-1];return row("chat",ic("phone"),"#0a84ff",esc(a.find(x=>x.sender!=="admin")?.name||m.name||"Visitor"),`${m.sender==="admin"?"You: ":""}${esc(m.text||"").slice(0,75)} · ${new Date(m.at||Date.now()).toLocaleString()}`,`data-go="chat" data-id="${esc(m.chatId)}"`)}).join('')}</div>` : `<div class="group"><div class="empty">No visitor messages yet.</div></div>`}`;

async function makePDF(b) {
  await loadPDF();
  const d = new window.jspdf.jsPDF({unit: "mm", format: "a4"}), W = 210, M = 14, C = S.contact, br = S.brand;
  const T = (s, x, y, o) => d.text(L1(s), x, y, o);
  d.setFillColor(11, 18, 32); d.rect(0, 0, W, 38, "F"); d.setFillColor(255, 184, 77); d.rect(0, 38, W, 1.6, "F");
  let tx = M;
  const fm = /^data:image\/(png|jpe?g)/i.exec(br.logoUrl || "");
  if (fm) { try { d.addImage(br.logoUrl, fm[1].toLowerCase() === "png" ? "PNG" : "JPEG", M, 7, 24, 24); tx = M + 30; } catch (e) {} }
  d.setTextColor(255); d.setFont("helvetica", "bold"); d.setFontSize(17); T((br.text1 + br.text2).trim().toUpperCase(), tx, 17);
  d.setFont("helvetica", "normal"); d.setFontSize(8.5); d.setTextColor(200, 208, 220);
  T(br.tagline || "", tx, 23); T(C.address || "", tx, 28); T([C.phoneShow, C.phoneShow2].filter(Boolean).join("  /  "), tx, 33);
  d.setTextColor(255, 184, 77); d.setFont("helvetica", "bold"); d.setFontSize(24); T("INVOICE", W - M, 21, {align: "right"});
  // bill to + meta
  d.setTextColor(120); d.setFontSize(8); T("BILLED TO", M, 51);
  d.setTextColor(20); d.setFontSize(11); T(b.name, M, 57);
  d.setFont("helvetica", "normal"); d.setFontSize(9.5); d.setTextColor(60);
  let ly = 62; if (b.phone) { T(b.phone, M, ly); ly += 5; }
  if (b.addr) { const ls = d.splitTextToSize(L1(b.addr), 90); d.text(ls, M, ly); ly += ls.length * 4.6; }
  const meta = [["Invoice No", b.no], ["Date", new Date(b.at).toLocaleDateString()], ...(b.ref ? [["Booking Ref", b.ref]] : []), ["Payment", b.method], ["Status", b.status.toUpperCase()]];
  let my = 51; meta.forEach(([k, v]) => { d.setFont("helvetica", "normal"); d.setTextColor(120); d.setFontSize(8.5); T(k, 125, my); d.setFont("helvetica", "bold"); d.setTextColor(20); d.setFontSize(9.5); T(v, W - M, my, {align: "right"}); my += 6; });
  // table
  let y = Math.max(ly, my) + 6;
  d.setFillColor(238, 241, 246); d.rect(M, y, W - 2 * M, 8, "F"); d.setFont("helvetica", "bold"); d.setFontSize(8.5); d.setTextColor(40);
  T("#", M + 2, y + 5.4); T("DESCRIPTION", M + 12, y + 5.4); T("QTY", 128, y + 5.4, {align: "right"}); T("UNIT PRICE", 160, y + 5.4, {align: "right"}); T("AMOUNT", W - M - 2, y + 5.4, {align: "right"});
  y += 8; d.setFont("helvetica", "normal"); d.setFontSize(9.5);
  b.items.forEach((it, i) => {
    const ls = d.splitTextToSize(L1(it.d), 88), h = Math.max(8, ls.length * 4.8 + 3.5);
    if (y + h > 250) { d.addPage(); y = 20; }
    d.setTextColor(60); T(String(i + 1), M + 2, y + 5.4); d.setTextColor(20); d.text(ls, M + 12, y + 5.4);
    T(String(it.q), 128, y + 5.4, {align: "right"}); T(money(it.p), 160, y + 5.4, {align: "right"}); T(money(it.q * it.p), W - M - 2, y + 5.4, {align: "right"});
    y += h; d.setDrawColor(228, 231, 236); d.line(M, y, W - M, y);
  });
  // totals
  if (y > 225) { d.addPage(); y = 20; }
  y += 6; const row2 = (k, v) => { d.setFont("helvetica", "normal"); d.setFontSize(9.5); d.setTextColor(90); T(k, 130, y); d.setTextColor(20); T(v, W - M - 2, y, {align: "right"}); y += 6.5; };
  row2("Subtotal", money(b.sub)); if (b.disc) row2("Discount", "- " + money(b.disc)); if (b.taxAmt) row2(`Tax (${b.tax}%)`, money(b.taxAmt));
  d.setFillColor(11, 18, 32); d.roundedRect(120, y - 1, W - M - 120, 11, 2, 2, "F"); d.setTextColor(255); d.setFont("helvetica", "bold"); d.setFontSize(11);
  T("TOTAL", 125, y + 6.4); d.setTextColor(255, 184, 77); T(money(b.total), W - M - 4, y + 6.4, {align: "right"});
  const paid = b.status === "Paid", col = paid ? [30, 160, 80] : [215, 70, 50];
  d.setDrawColor(...col); d.setTextColor(...col); d.setLineWidth(.8); d.roundedRect(M, y - 1, 36, 12, 2, 2, "S"); d.setFontSize(12); T(paid ? "PAID" : "UNPAID", M + 18, y + 6.9, {align: "center"});
  y += 20;
  if (b.note) { d.setFont("helvetica", "bold"); d.setFontSize(8.5); d.setTextColor(120); T("NOTES", M, y); d.setFont("helvetica", "normal"); d.setFontSize(9.5); d.setTextColor(50); d.text(d.splitTextToSize(L1(b.note), W - 2 * M), M, y + 5); }
  // footer on every page
  const n = d.getNumberOfPages();
  for (let p = 1; p <= n; p++) {
    d.setPage(p); d.setDrawColor(228, 231, 236); d.setLineWidth(.3); d.line(M, 277, W - M, 277);
    d.setFont("helvetica", "bold"); d.setFontSize(9); d.setTextColor(40); T("Thank you for choosing " + (br.text1 + br.text2).trim() + "!", W / 2, 283, {align: "center"});
    d.setFont("helvetica", "normal"); d.setFontSize(7.5); d.setTextColor(140); T("This is a computer-generated invoice.  |  Powered by Rush Environment", W / 2, 288, {align: "center"});
  }
  return d;
}

async function shareBill(b) {
  const doc = await makePDF(b), name = b.no + ".pdf", text = waText(b);
  const file = new File([doc.output("blob")], name, {type: "application/pdf"});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], text, title: b.no}); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  doc.save(name);
  window.open("https://wa.me/" + waNum(b.phone) + "?text=" + encodeURIComponent(text), "_blank");
  toast("PDF saved — attach it in the WhatsApp chat");
}

const billSync = e => {
  const t = e.target; if (!BILL) return;
  if (t.dataset.bpick) {
    if (BILL.ref === t.value) return;
    BILL = newBill(B.find(x => x.id === t.value)); render();
    setTimeout(() => { const p = root.querySelector('[data-it="0:p"]'); if (p) p.focus(); }, 0); return;
  }
  if (t.dataset.bf) BILL[t.dataset.bf] = t.value;
  else if (t.dataset.it) { const [i, f] = t.dataset.it.split(":"); if (BILL.items[i]) BILL.items[i][f] = t.value; } else return;
  const el = $("#billTot"); if (el) el.innerHTML = totHTML(calc(BILL));
};
root.addEventListener("input", billSync); root.addEventListener("change", billSync);
root.addEventListener("click", async e => {
  const el = e.target.closest("[data-bact]"); if (!el) return;
  const a = el.dataset.bact, id = el.dataset.id;
  if (a === "new") { BILL = newBill(); go("billnew"); }
  else if (a === "fromBooking") { BILL = newBill(B.find(x => x.id === id)); go("billnew"); }
  else if (a === "add") { BILL.items.push({d: "", q: 1, p: ""}); render(); }
  else if (a === "del") { if (BILL.items.length > 1) { BILL.items.splice(Number(el.dataset.i), 1); render(); } }

const VLINK_RE = /https?:\/\/(?:[\w-]+\.)*(?:tiktok\w*\.com|youtu\.be|youtube\.com|youtube-nocookie\.com|instagram\.com|facebook\.com|fb\.watch|fb\.com|vimeo\.com|drive\.google\.com)\/[^\s]*|https?:\/\/[^\s]+?\.(?:mp4|webm|mov|m4v)(?:\?[^\s]*)?/i;

async function fetchT(url, ms) { const c = new AbortController(), t = setTimeout(() => c.abort(), ms); try { return await fetch(url, { signal: c.signal }); } finally { clearTimeout(t); } }
/* short TikTok links (vm.tiktok.com / vt.tiktok.com / tiktok.com/t/…) -> real video id; several routes run in parallel, first answer wins */
async function resolveTikTok(u) {
  const oe = "https://www.tiktok.com/oembed?url=" + encodeURIComponent(u);
  const tries = [
    async () => tkId((await (await fetchT(oe, 8000)).json()).html),
    async () => { const j = await (await fetchT("https://api.allorigins.win/get?url=" + encodeURIComponent(u), 12000)).json(); return tkId(j.status && j.status.url) || tkId(j.contents); },
    async () => tkId(await (await fetchT("https://corsproxy.io/?url=" + encodeURIComponent(oe), 12000)).text()),
    async () => tkId(await (await fetchT("https://api.allorigins.win/raw?url=" + encodeURIComponent(oe), 12000)).text()),
    async () => tkId(await (await fetchT("https://corsproxy.io/?url=" + encodeURIComponent(u), 12000)).text())
  ];
  return new Promise(res => { let n = tries.length; tries.forEach(f => f().then(id => { if (id) res(id); else if (!--n) res(null); }).catch(() => { if (!--n) res(null); })); });
}
async function parseVideoLink(raw) {
  raw = String(raw || "");
  if (/^\s*\d{15,25}\s*$/.test(raw)) return { embed: "tiktok", eid: raw.trim(), url: "https://www.tiktok.com/video/" + raw.trim() };   /* bare TikTok video id */
  let u = (raw.match(/https?:\/\/[^\s]+/) || raw.match(/(?:[\w-]+\.)*(?:tiktok\w*\.com|youtu\.be|youtube\.com|instagram\.com|facebook\.com|fb\.watch|vimeo\.com)\/[^\s]*/i) || [""])[0].replace(/[)\].,;!]+$/, "");
  if (!u) return null; if (!/^https?:/i.test(u)) u = "https://" + u;
  let m;
  if (/tiktok\w*\.com/i.test(u)) { const id = tkId(u) || await resolveTikTok(u); return id ? { embed: "tiktok", eid: id, url: u } : { error: "tiktok" }; }
  if ((m = u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:[^#\s]*&)?v=|shorts\/|embed\/|live\/|v\/))([\w-]{11})/i))) return { embed: "youtube", eid: m[1], url: u };
  if ((m = u.match(/instagram\.com\/(?:[\w.]+\/)?(p|reels?|tv)\/([\w-]+)/i))) return { embed: "instagram", eid: (m[1].toLowerCase().indexOf("reel") === 0 ? "reel" : m[1].toLowerCase()) + "/" + m[2], url: u };
  if (/(facebook\.com|fb\.watch|fb\.com)/i.test(u)) return /(videos|watch|reel|fb\.watch|\/v\/|share\/[vr])/i.test(u) ? { embed: "facebook", eid: u, url: u } : { error: "fb" };
  if ((m = u.match(/vimeo\.com\/(?:[\w\/]*?)(\d{6,12})/i))) return { embed: "vimeo", eid: m[1], url: u };
  if ((m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/i))) return { embed: "drive", eid: m[1], url: u };
  if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(u)) return { file: true, url: u };
  return null;
}

  else if(a === "evnewteacher"){ const ev = S.events[Number(d.i)]; if(!ev) return; ensureTIds(); const t = VX.clone(LISTS.teachers.blank); t.id = VX.uid("T"); S.home.teachers.push(t); ev.teacherIds = (Array.isArray(ev.teacherIds) ? ev.teacherIds : []).concat(t.id); save(true); go("item", {key:"teachers", i:S.home.teachers.length-1}); }
  else if(a === "videoup"){ $("#postVideoFile")?.click(); }
  else if(a === "videodel"){ const p=S.posts[Number(d.i)]; if(p){ if(p.vmedia) VX.deleteMedia(p.vmedia); p.vmedia=null; p.mediaUrl=""; save(true); render(); } }
  else if(a === "teacherphotoup"){ $("#teacherPhotoFile")?.click(); }
  else if(a === "teacherphotodel"){ const t=S.home.teachers[Number(d.i)]; if(t){t.photoUrl=""; save(true); render();} }
  else if(a === "export"){ dl("teacher-settings.json", JSON.stringify(S, null, 2), "application/json"); toast("Exported"); }
  else if(a === "import"){ $("#impFile").click(); }
  else if(a === "csv"){
    const cols = ["id","status","name","phone","service","urg","elec","date","time","addr","note"];
    const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
    dl("bookings.csv", "\ufeff" + [cols.concat("answers","created").join(",")].concat(B.map(b => cols.map(c => q(b[c])).concat(q(new Date(b.at).toISOString())).join(","))).join("\n"), "text/csv");
  }
  else if(a === "reset"){
    iosConfirm("Reset All Settings?", "Restore all site settings & theme to factory defaults?", true, async () => {
      S = VX.clone(VX.DEFAULTS); await save(true); render();
    });
  }
});

$("#logoFile").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = () => {
    const s = 256, c = document.createElement("canvas"); c.width = c.height = s;
    const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,s,s);
    const m = Math.min(img.width, img.height);
    x.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, s, s);
    S.brand.logoUrl = c.toDataURL("image/jpeg", .85); URL.revokeObjectURL(url);
    save(true); render();
  };
  img.onerror = () => toast("Invalid image", true);
  img.src = url; e.target.value = "";
});
root.addEventListener("change", async e => {
  if(e.target.id === "teacherPhotoFile"){
    const f=e.target.files && e.target.files[0]; if(!f) return;
    if(f.type && !/^image\//.test(f.type)){toast("Choose an image file",true);e.target.value="";return;}
    if(f.size>8*1024*1024){toast("Image is over 8 MB",true);e.target.value="";return;}
    const t=S.home.teachers[Number(curPage().i)]; if(!t){e.target.value="";return;}
    const status=$("#teacherPhotoProgress"); if(status)status.textContent="Uploading photo…";
    try{
      let url="";
      if(VX.mode==="firebase" && window.firebase && firebase.storage && (window.FIREBASE_CONFIG||{}).storageBucket){
        try{
          const safeName=f.name.replace(/[^a-zA-Z0-9._-]/g,"_");
          const ref=firebase.storage().ref().child("vx_teachers/"+Date.now()+"_"+safeName);
          await ref.put(f,{contentType:f.type}); url=await ref.getDownloadURL();
        }catch(e2){console.warn("Storage upload failed, saving inline",e2);}
      }
      if(!url){
        url=await new Promise((res,rej)=>{ const u=URL.createObjectURL(f), im=new Image();
          im.onload=()=>{ const r=Math.min(1,480/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r); const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); let q=.82, d=c.toDataURL("image/jpeg",q); while(d.length>120000 && q>.35){ q-=.1; d=c.toDataURL("image/jpeg",q); } res(d); };
          im.onerror=()=>rej(new Error("Invalid image")); im.src=u; });
      }
      const oldUrl=t.photoUrl; t.photoUrl=url;
      try{ await VX.saveSettings(S); }catch(se){ t.photoUrl=oldUrl; throw se; }
      toast("Teacher photo saved"); render();
    }catch(err){console.error(err);toast("Photo upload failed: "+(err.code||err.message),true);if(status)status.textContent="Upload failed";}
    e.target.value=""; return;
  }
  if(e.target.id !== "postVideoFile") return;
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const post = S.posts[Number(curPage().i)];
  if(!post) return;
  if(!/^video\/(mp4|webm|quicktime)$/.test(f.type) && !/\.(mp4|webm|mov)$/i.test(f.name)){
    toast("Choose an MP4, WebM or MOV video", true); e.target.value = ""; return;
  }
  const so = S.social || {}, status = $("#videoProgress"), say = t => { if(status) status.textContent = t; };
  try{
    const pr = await VX.prepareVideo(f, so, say);
    say("Uploading video (" + fmtSize(pr.blob.size) + ")… 0%");
    const nm = await VX.saveMedia(pr.blob, pr.meta, p => say("Uploading video… " + Math.round(p * 100) + "%"));
    if(post.vmedia) await VX.deleteMedia(post.vmedia);
    post.vmedia = nm; post.mediaUrl = "";
    await save(true); toast("Video uploaded"); render();
  }catch(err){ console.error(err); toast("Video upload failed: " + (err.code || err.message), true); say("Upload failed"); }
  e.target.value = "";
});
$("#impFile").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try{ S = VX.fix(VX.merge(VX.DEFAULTS, JSON.parse(rd.result))); await save(true); render(); }
    catch(err){ toast("Invalid JSON file", true); }
    e.target.value = "";
  };
  rd.readAsText(f);
});

/* ---------- login + boot ---------- */
function loginScreen(){
  const logo = (VX.DEFAULTS.brand && VX.DEFAULTS.brand.logoUrl) || "";
  root.innerHTML = `<div class="lock"><div class="li${logo ? " img" : ""}" id="lockLogo">${logo ? `<img src="${esc(logo)}" alt="Teacher">` : ic("bolt")}</div><h1>Teacher Admin</h1><p>Enter your PIN to unlock Control Center (default: 1234)</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="••••" autofocus><div class="er" id="er"></div>
    <button class="pill" id="go" style="width:220px">Unlock</button></div>`;
  const tryIt = () => {
    if($("#pin").value === VX.LS.get("vx_pin", "1234")){ sessionStorage.setItem("vx_admin","1"); boot(); }
    else { $("#er").textContent = "Wrong PIN (default: 1234)"; $("#pin").value = ""; }
  };
  /* use the logo saved in settings (if the admin uploaded a different one) */
  Promise.resolve(VX.loadSettings()).then(st => {
    const u = st && st.brand && st.brand.logoUrl, el = $("#lockLogo");
    if (u && el && u !== logo) { el.classList.add("img"); el.innerHTML = `<img src="${esc(u)}" alt="Teacher">`; }
  }).catch(() => {});
  $("#go").onclick = tryIt; setTimeout(() => $("#pin").focus(), 50); $("#pin").addEventListener("keydown", e => { if(e.key === "Enter") tryIt(); });
}
root.addEventListener("input", e => { const t = e.target; if(t.matches && t.matches("#adminChatForm textarea")){ t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; } });
root.addEventListener("keydown", e => {
  if(e.key !== "Enter" || e.shiftKey || e.isComposing || !e.target.matches || !e.target.matches("#adminChatForm textarea")) return;
  if(!window.matchMedia("(pointer:fine)").matches) return;
  e.preventDefault(); const f = e.target.form; f.requestSubmit ? f.requestSubmit() : f.querySelector("button").click();
});
root.addEventListener("submit", async e => {
  if(e.target.id !== "adminChatForm") return;
  e.preventDefault();
  const f=e.target, btn=f.querySelector("button"), text=f.elements.text.value.trim(), chatId=f.elements.chatId.value;
  if(!text) return;
  btn.disabled=true;
  try { await VX.addChatMessage({id:VX.uid("MSG"),chatId,sender:"admin",name:"Teacher",phone:"",text,at:Date.now()}); f.elements.text.value=""; f.elements.text.style.height=""; toast("Reply sent"); }
  catch(err){ toast("Message failed: "+(err.code||err.message),true); }
  finally{ btn.disabled=false; }
});

async function boot(){
  root.innerHTML = `<div class="lock"><p>Loading Control Center…</p></div>`;
  S = await VX.loadSettings();
  VX.loadFonts([S.theme.fontHead, S.theme.fontBody]);
  VX.onBookings(l => {
    if(bInit && l.length > B.length) toast("New booking received!");
    B = l; bInit = true; softRender();
  });
  VX.onReviews(l => { R = l; softRender(); });
  VX.onRegistrations(l => {
    if(gInit && l.length > G.length) toast("New event registration!");
    G = l; gInit = true; softRender();
  });
  VX.onChatMessages(l => { CHAT = l; softRender(); liveChat(); });
  VX.onPosts(l => { PS = l; softRender(); });
  VX.onComments(l => { CM = l; softRender(); });
  VX.onLikes(l => { LK = l; softRender(); });
  render();
}
if(sessionStorage.getItem("vx_admin") === "1") boot(); else loginScreen();
</script>

<script>

  if(!RM && !document.body.classList.contains("noanim")) document.body.insertBefore(W, document.body.firstChild); else W = null;
  function fillBrand(){
    if(!W) return;
    var b = document.querySelector("#brand"), lg = W.querySelector(".w-lg");
    if(window.__LOCK && !lg.querySelector("img")){ var pi=document.createElement("img"); pi.src=window.__LOCK.teacher.photoUrl; pi.alt=""; lg.innerHTML=""; lg.appendChild(pi); }
    if(b){

      if(s) W.querySelector(".w-tag").textContent = s.textContent.trim();
    } else if(!lg.firstChild){ lg.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.500 5-3v-4.500"/></svg>'; var h=document.title.split("—"); W.querySelector(".w-name span").textContent=(h[0]||"Welcome").trim(); if(h[1]) W.querySelector(".w-tag").textContent=h[1].trim(); }
  }
  fillBrand(); var bi = setInterval(fillBrand, 250);
  var t0 = Date.now();
